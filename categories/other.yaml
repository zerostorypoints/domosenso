# temperature, which would read as a contact sensor or a thermometer. Also the fallback.
id: other
order: 45
names: {en: Other, de: Sonstiges, pl: Inne}
colour: "#9e9e9e"
marker: circle
fallback: true
match:
  - entity_domain: [vacuum, lawn_mower]
  - integration: [miele, home_connect]
