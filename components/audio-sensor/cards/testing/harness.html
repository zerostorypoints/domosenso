<!doctype html>
<!-- Local look at the card outside Home Assistant. From the repository root:
     python3 -m http.server 8765, then open http://localhost:8765/components/audio-sensor/cards/testing/harness.html
     (?lang=de|pl, ?dark). One demo card per registered flavour and kind, one card fed through a
     fake hass entity (exercises the hass path), one whose entity never reports (the classic fallback
     with its icon), and one with `active` toggled off and on. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ambient wave harness</title>
  <style>
    :root { --primary-color: #03a9f4; --card-background-color: #fff; --secondary-text-color: #727272;
      --divider-color: #e0e0e0; --bg: #f5f5f5; --fg: #212121; }
    :root.dark { --card-background-color: #1c1c1c; --secondary-text-color: #9e9e9e; --divider-color: #333;
      --bg: #111; --fg: #e1e1e1; }
    body { margin: 0; padding: 16px; background: var(--bg); color: var(--fg); font: 14px system-ui, sans-serif; }
    main { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 12px; }
    figure { margin: 0; }
    figcaption { margin: 0 0 4px; color: var(--secondary-text-color); font-size: 12px; }
    .cell { height: 120px; }
    .cell.tall { height: auto; min-height: 120px; }
    ha-card { display: block; border-radius: 12px; background: var(--card-background-color); }
  </style>
</head>
<body>
  <main id="grid"></main>
  <script type="module">
    const base = "..";
    await import(`${base}/ambient-wave-card.js`);
    const { FLAVOURS } = await import(`${base}/lib/flavours/index.js`);
    const { Demo } = await import(`${base}/lib/sources.js`);

    const params = new URLSearchParams(location.search);
    if (params.has("dark")) document.documentElement.classList.add("dark");
    const language = params.get("lang") ?? "en";
    // ha-card is Home Assistant's; a plain block stands in for it here.
    if (!customElements.get("ha-card")) customElements.define("ha-card", class extends HTMLElement {});
    // ha-icon too: a plain glyph stands in for the Material Design icon.
    if (!customElements.get("ha-icon")) customElements.define("ha-icon", class extends HTMLElement {
      connectedCallback() { this.textContent = "\u24d8"; }
    });

    const states = {};
    const hass = () => ({ language, locale: { language }, themes: {}, states: { ...states } });
    const cards = [];
    const add = (caption, config) => {
      const fig = document.createElement("figure");
      fig.innerHTML = `<figcaption></figcaption><div class="cell"></div>`;
      fig.querySelector("figcaption").textContent = caption;
      const card = document.createElement("ambient-wave-card");
      card.setConfig(config);
      // The console makes the card taller than a grid cell; let its cell grow with it.
      if (config.controls) fig.querySelector(".cell").classList.add("tall");
      fig.querySelector(".cell").appendChild(card);
      document.getElementById("grid").appendChild(fig);
      cards.push(card);
    };

    for (const [id, f] of Object.entries(FLAVOURS)) {
      for (const kind of f.kinds) add(`${id} · ${kind} · demo`, { source: { kind, demo: true }, flavour: id });
    }
    add("stub config (swell)",
      customElements.get("ambient-wave-card").getStubConfig());
    add("spectrum entity via hass (offset 95)", { source: { kind: "spectrum", entity: "sensor.fake_spectrum", offset: 95 } });
    add("console (controls: true)", { source: { kind: "spectrum", demo: true }, controls: true });
    add("console, single value", { source: { kind: "scalar", demo: true }, flavour: "tide", controls: true });
    add("fallback classic: a sensor that sends nothing", { source: { kind: "spectrum", entity: "sensor.fake_silent" }, fallback: "classic" });
    add("active toggles every 6 s", { source: { kind: "spectrum", demo: true }, active: "binary_sensor.fake_playing" });

    const room = new Demo("jazz");
    const t0 = performance.now();
    const now = () => new Date().toISOString();
    const publish = () => { for (const c of cards) c.hass = hass(); };
    setInterval(() => {
      const bands = room.bands((performance.now() - t0) / 1000).map((v) => (v - 95).toFixed(1));
      states["sensor.fake_spectrum"] = { state: bands.join(","), attributes: {}, last_updated: now(), last_reported: now() };
      publish();
    }, 200);
    let on = true;
    const toggle = () => {
      states["binary_sensor.fake_playing"] = { state: on ? "on" : "off", attributes: {}, last_updated: now() };
      on = !on;
      publish();
    };
    toggle();
    setInterval(toggle, 6000);
  </script>
</body>
</html>
