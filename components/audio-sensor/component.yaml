# Domosenso component manifest (SPEC-018): a room sound sensor on an M5Stack Atom EchoS3R. A remote
# ESPHome package with its spectrum component, the device file template and a factory image; a Home
# Assistant package (SPL offsets, calibration helpers, the music aliases and their source select);
# two cards, `ambient-wave-card` and `room-meter-card`. No dashboard of its own: Ramka 0.4.0 shows the
# music visual and its settings. Upgrade notes: UPGRADE.md; how a home uses it: README.md.
id: audio-sensor
version: 0.4.0
summary: A room sound sensor on an M5Stack Atom EchoS3R, with sound level and a third-octave spectrum
description_key: meta.description
photo: null

devices:
  requires:
    - kind: sound-sensor
      recommend: [m5stack-atom-echos3r]
      count: "1 or more"                  # one board per room; at most one of them marks `music: true`
      power: "5 V USB"
  optional:
    - kind: led-strip                     # SPEC-043: the music strip on a board's Grove port
      recommend: [m5stack-led-strip-sk6812]
      count: "0 or 1 per board"
      power: "5 V: the board's Grove port up to about 30 LEDs, else its own supply"

host:
  installs: [container, haos]             # container = no apps; nothing here needs a service
  ha_min: "2026.9"

integrations:
  - {name: esphome, source: core, setup: "adopt the board in Home Assistant once flashed (discovery confirmation), with the API key from the home's ESPHome secrets"}
  - {name: "ESPHome (firmware)", source: firmware, tested: "2026.9.1", setup: "flash the first time over USB (download mode: hold the button while plugging in); then OTA"}
  - {name: template, source: core}

# Values the home supplies; `domosenso add` writes the inputs skeleton, the add-component skill fills it.
inputs:
  sensors:                                # one item per board; one device file each
    type: "list[{room: slug, area: area_name, music: bool, id_prefix: slug, name: str, friendly_name: str, mic_gain: str, entities: map, online?: entity_id, strip?: map}]"
    example:
      - {room: living-room, area: Living room, music: true}
      - {room: kids-room, area: "Kids' room"}
    item:
      room: {type: slug, note: "the board's hostname part (audio-sensor-<room>), words joined by -"}
      area: {type: area_name, note: "the Home Assistant area"}
      music: {type: bool, default: false, note: "this board is the default music source (the select's first option); at most one item"}
      id_prefix: {type: slug, default: "the room slug with _", note: "prefix of the ids this component creates for the board"}
      name: {type: str, default: "audio-sensor-<room>", note: "ESPHome substitution"}
      friendly_name: {type: str, default: "Audio sensor <area>", note: "ESPHome substitution"}
      mic_gain: {type: str, default: 24DB, note: "ES8311 gain, 0DB to 42DB; changing it means calibrating again"}
      online: {type: entity_id, default: null, note: "Explicit optional availability sensor for assistant answers."}
      strip:
        type: "{leds?: int, pin?: str, follow?: entity_id, ambient_light?: entity_id, entities?: map}"
        default: null
        note: "SPEC-043: an addressable LED strip on the board's Grove port that follows the music; without it nothing of the strip is built or rendered"
        fields:
          leds: {type: int, default: 120, note: "LEDs on the strip, 1 to 300"}
          pin: {type: str, default: GPIO2, note: "the Grove signal wire: GPIO2 yellow (G2), GPIO1 white (G1)"}
          follow: {type: entity_id, default: null, note: "the strip turns on while this entity plays (a media player) or is on; none: nothing switches it"}
          ambient_light: {type: entity_id, default: null, note: "an illuminance sensor the strip's brightness follows; none: no brightness automation"}
          entities:
            type: "map[key, entity_id]"
            default: "<domain>.<area slug>_<name slug with _>_<key slug>"
            keys:
              light: light.<..>_music_strip
              palette: select.<..>_strip_palette
              custom_palette: text.<..>_strip_custom_palette
              intensity: number.<..>_strip_intensity
              mounting: select.<..>_strip_mounting
              power_limit: number.<..>_strip_power_limit
              current: sensor.<..>_strip_current
      entities:
        type: "map[key, entity_id]"
        # Home Assistant builds an ESPHome entity's id from the device's names and area when the board
        # is adopted, and a renamed device keeps its old ids, so they cannot be derived from `room`
        # and `area` reliably. The default is a guess the add-component skill corrects from the
        # running Home Assistant.
        default: "<domain>.<area slug>_<name slug with _>_<key slug>"
        keys:
          spectrum: sensor.<..>_spectrum
          level: sensor.<..>_sound_level
          peak: sensor.<..>_sound_peak
          fast_level: sensor.<..>_fast_sound_level
          fast_peak: sensor.<..>_fast_sound_peak
          live_tracking: switch.<..>_live_tracking
          mic_gain: sensor.<..>_mic_gain
          wifi_signal: sensor.<..>_wi_fi_signal
          uptime: sensor.<..>_uptime
          bssid: sensor.<..>_connected_ap_bssid
          restart: button.<..>_restart
          load: sensor.<..>_spectrum_load
          spectrum_rate: select.<..>_spectrum_rate

assistant:
  version: 1
  definition: assistant.yaml
  bindings: templates/assistant-bindings.yaml.j2

artifacts:
  esphome:
    packages:                             # remote package, github://zerostorypoints/domosenso/components/audio-sensor/esphome/audio-sensor.yaml@audio-sensor/<version>
      - {file: esphome/audio-sensor.yaml, project: domosenso.audio-sensor}
      - {file: esphome/music-strip.yaml, project: domosenso.audio-sensor}   # SPEC-043, only a board with `strip:`
    factory: esphome/audio-sensor.factory.yaml   # Improv + dashboard_import, for boards nobody configured yet
    instance: examples/demo-home/esphome/audio-sensor-<room>.yaml   # the demo home's device files, as `devices` renders them from its inputs
    devices:                              # `domosenso add` writes one thin device file per `sensors` item, once; the home owns it
      {template: esphome/device.yaml.j2, each: sensors, file: audio-sensor-<room>.yaml}
    secrets: [wifi_ssid, wifi_password, api_encryption_key]   # what the device files read; `status` names a missing one
  # The spectrum component the package loads with external_components; it is not an artifact a home
  # receives, ESPHome pulls it from the tag (a fixed `ref`, checked against `version`).
  templates:                            # rendered per home by tools/domosenso_render.py
    - templates/assistant-bindings.yaml.j2
    - templates/package.yaml.j2         # -> package.yaml, the home's packages/: offsets, recorder exclusions, music aliases
  ha_packages: []
  # Where the cards go in the home's config, served as /local/domosenso/audio-sensor/<version>/:
  # cards/*.js, cards/lib/** and translations/ keep their paths from this directory (tests and
  # cards/testing/ stay behind). The cards have no version of their own: a new component version is
  # a new directory, so the /local/ cache cannot serve an old lib/ to a new card.
  install_path: www/domosenso/audio-sensor/<version>/
  dashboard_cards:                      # Lovelace resources (type: module); they import lib/ and translations/
    - cards/ambient-wave-card.js        # the live wave from the spectrum or the level; classic fallback
    - cards/room-meter-card.js          # the analogue meter: needle, zones, clip mark

provides:                                 # contract surface; placeholders in <> come from inputs
  project: {name: domosenso.audio-sensor, stability: stable}   # reported to Home Assistant as manufacturer domosenso
  entities:
    # The Home Assistant package (templates/package.yaml.j2).
    - {id: "input_number.<id_prefix>_spl_offset", stability: stable, note: "0-140 dB, step 0.1, no initial: a fresh helper starts at 0 and the README's calibration sets it"}
    - {id: "sensor.<id_prefix>_spl_offset", stability: stable, note: "the offset as a sensor; attribute calibrated (true while input_boolean.<id_prefix>_spl_calibrated is on)"}
    - {id: "sensor.music_spectrum", stability: stable, note: "the selected board's Spectrum CSV, dBFS, unchanged; excluded from the recorder"}
    - {id: "sensor.music_spl_offset", stability: stable, note: "that board's offset, dB; attribute calibrated, from that board's flag"}
    - {id: "sensor.music_level", stability: stable, note: "its 1 s Sound level plus the offset, dB SPL; none while the source has no number"}
    - {id: "binary_sensor.music_sensor_online", stability: stable, note: "on while the selected board's Spectrum sensor is neither unavailable nor unknown"}

    # The music source and the calibration helpers (SPEC-021). The aliases above follow the select; a
    # select state that is no option reads the `music: true` board, or nothing when none is marked.
    - {id: "input_select.audio_sensor_music_source", stability: stable, note: "options: the boards' areas, the music board first then input order, then \u2014 (no sensor); without a `music: true` board \u2014 comes first; always rendered; no initial:"}
    - {id: "sensor.music_mic_gain", stability: stable, note: "the selected board's Mic gain text, unchanged"}
    - {id: "sensor.music_spl_calibration", stability: stable, note: "calibrated or estimate, from the selected board's flag; attribute note"}
    - {id: "input_boolean.<id_prefix>_spl_calibrated", stability: stable, note: "per board; off = the offset is an estimate; no initial:"}
    - {id: "input_text.<id_prefix>_spl_note", stability: stable, note: "per board, up to 255 characters; no initial:"}
    - {id: "input_number.audio_sensor_measured_offset", stability: stable, note: "always rendered; 0-140 dB, step 0.1, the measurement to apply; no initial:"}
    - {id: "input_text.audio_sensor_calibration_note", stability: stable, note: "always rendered; the note to apply, up to 255 characters; no initial:"}
    - {id: "script.audio_sensor_apply_calibration", stability: stable, note: "writes the measured offset and the note into the selected board's helpers and turns its calibrated flag on"}

    # The music source contract (SPEC-025, 0.3.0): which board feeds the aliases and what it can
    # do. A trigger-based template (HA start, a change of the select, every minute), never on the spectrum.
    - {id: "sensor.music_source", stability: additive-only, note: "SPEC-025, 0.3.0; the selected board's area, or none; attributes interface (1) and capabilities, a list of spectrum, level, rate, calibration, gain in that order"}
    - {id: "binary_sensor.music_source_spectrum", stability: additive-only, note: "SPEC-025, 0.3.0; on while the selected board has a spectrum entity that is unavailable, unknown or 31 numbers; never unavailable"}
    - {id: "binary_sensor.music_source_level", stability: additive-only, note: "SPEC-025, 0.3.0; on while the selected board has a level entity that is unavailable, unknown or a number"}
    - {id: "binary_sensor.music_source_rate", stability: additive-only, note: "SPEC-025, 0.3.0; on while the selected board has a spectrum-rate select offering eco, normal and fast"}
    - {id: "binary_sensor.music_source_calibration", stability: additive-only, note: "SPEC-025, 0.3.0; on with level (the offset applies to the level)"}

    # The spectrum rate (#99, #110): the choice, the watching flag and the automation that forwards
    # them to the selected board's Spectrum rate select.
    - {id: "input_select.audio_sensor_music_spectrum_rate", stability: stable, note: "always rendered; options eco, normal, fast (additive-only); no initial:; a state that is no option reads as normal"}
    - {id: "input_boolean.audio_sensor_music_watching", stability: stable, note: "always rendered; on while a view shows the music visual (the Ramka sets it); no initial:"}
    - {id: "automation.audio_sensor_music_spectrum_rate", unique_id: audio_sensor_music_spectrum_rate, stability: additive-only, note: "sets the selected board's Spectrum rate to the choice, fast only while watching is on (else normal, 10 s after watching turns off); re-applies on HA start, a source change and any change of the board's select, its 60 min timeout included; the board a source change leaves goes back to normal"}

    # SPEC-043: the music strip, rendered only when a board has `strip:`. A home without a strip
    # gets none of these.
    - {id: "light.music_strip", stability: stable, note: "SPEC-043; the selected board's strip light: on/off, brightness, effect; unavailable while that board has no strip"}
    - {id: "binary_sensor.music_source_strip", stability: stable, note: "SPEC-043; on while the selected board has a strip light; never unavailable; attribute light: that board's strip light id (empty without one); sensor.music_source's capabilities then end with strip (additive)"}
    - {id: "script.audio_sensor_music_strip_palette", stability: stable, note: "SPEC-043; field stops (2 to 5 #rrggbb): writes them to the selected board's custom palette and selects custom; changes nothing for other stops or a board without a strip"}
    - {id: "input_boolean.<id_prefix>_strip_follow_music", stability: stable, note: "SPEC-043, with strip.follow; on: the strip turns on while the follow entity plays (media player) or is on; no initial:"}
    - {id: "input_number.<id_prefix>_strip_follow_off_delay", stability: stable, note: "SPEC-043, with strip.follow; 0-600 s, step 5; the delay before the strip turns off; 0 (a fresh helper) means 30 s; no initial:"}
    - {id: "input_select.<id_prefix>_strip_follow_effect", stability: stable, note: "SPEC-043, with strip.follow; keep, Pulse, Glow, Bands, Centre meter, Spectrum, Ripple; options additive-only"}
    - {id: "automation.<id_prefix>_strip_follow_music", unique_id: "<id_prefix>_strip_follow_music", stability: additive-only, note: "SPEC-043, with strip.follow; restart mode; ignores attribute changes and unavailable/unknown"}
    - {id: "input_boolean.<id_prefix>_strip_ambient", stability: stable, note: "SPEC-043 stage B, with strip.ambient_light; on: the strip's brightness follows the light sensor while the strip is on; no initial: (off until the home turns it on)"}
    - {id: "input_number.<id_prefix>_strip_ambient_{dark_lux,bright_lux,min_pct,max_pct}", stability: stable, note: "SPEC-043 stage B; the curve, linear in log lux; while max_pct is 0 (a fresh helper) the automation uses 5 lx -> 20 %, 300 lx -> 100 %"}
    - {id: "automation.<id_prefix>_strip_ambient", unique_id: "<id_prefix>_strip_ambient", stability: additive-only, note: "SPEC-043 stage B; on every reading and when the strip turns on, only while it is on, when the brightness moves by 2 points or more, at most every 10 s"}

  # The board's ESPHome entities. Home Assistant builds their ids from the device's area and names
  # when the board is adopted (a renamed device keeps its old ids), so they are declared, not
  # promised (docs/COMPATIBILITY.md): the home's `entities` input maps each `entity_key` to its id.
  # `stability` is about the entity and its state, which the firmware owns, not about its id.
  upstream:
    - {id: "binary_sensor.<audio>_online", owner: esphome, stability: additive-only, note: "Optional explicitly mapped availability sensor."}
    - {entity_key: spectrum, owner: esphome, stability: stable,
       state: "31 comma-separated third-octave levels in dBFS, 20 Hz to 20 kHz"}
    - {id: "sensor.<audio>_sound_level", entity_key: level, owner: esphome, stability: stable, note: "1 s RMS in dBFS, unweighted"}
    - {entity_key: peak, owner: esphome, stability: stable, note: "loudest sample in that second, dBFS"}
    - {entity_key: fast_level, owner: esphome, stability: additive-only, note: "100 ms, only while Live tracking is on"}
    - {entity_key: fast_peak, owner: esphome, stability: additive-only, note: same}
    - {entity_key: live_tracking, owner: esphome, stability: stable, note: "off after a boot and after one hour"}
    - {entity_key: load, owner: esphome, stability: additive-only, note: "share of one core the spectrum worker uses"}
    - {entity_key: spectrum_rate, owner: esphome, stability: stable, note: "select eco, normal, fast; normal after a boot and an hour after fast (#110)"}
    - {entity_key: mic_gain, owner: esphome, stability: additive-only}
    - {entity_key: wifi_signal, owner: esphome, stability: additive-only}
    - {entity_key: uptime, owner: esphome, stability: additive-only}
    - {entity_key: bssid, owner: esphome, stability: additive-only}
    - {entity_key: restart, owner: esphome, stability: additive-only}

consumes: []

tested:
  ha: ["2026.9.2"]                        # the board adopted and its entities read on this version; check_config comes with the Home Assistant package
  esphome: ["2026.9.1"]                   # config of the package; compile with the device file task
  homes: 1
local_only: true
