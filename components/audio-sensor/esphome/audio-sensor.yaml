# Compatible Atom EchoS3R entry point. Pin map and ES8311 behavior remain unchanged.
# The owner keeps credentials and calibration in the thin device file.
packages:
  common: !include audio-sensor-common.yaml

substitutions:
  # Changing analog gain requires recalibrating the Home Assistant SPL offset.
  mic_gain: 24DB
  mic_gain_description: ${mic_gain}

esphome:
  project:
    name: domosenso.audio-sensor
    version: 0.5.0

esp32:
  variant: esp32s3
  flash_size: 8MB
  cpu_frequency: 240MHz
  framework:
    type: esp-idf

psram:
  mode: octal
  speed: 80MHz

# ---- Audio: ES8311 ADC over I2S, read only -------------------------------------------------------
# 48 kHz: the full audio band (to 24 kHz), which the spectrum will need; 16 kHz would stop at 8 kHz
# and miss the energy above it. 16-bit is what sound_level reads; it already spans more than the
# MEMS microphone's own noise floor allows.
i2c:
  - id: audio_i2c
    sda:
      number: GPIO45
      ignore_strapping_warning: true
    scl:
      number: GPIO0
      ignore_strapping_warning: true
    frequency: 100kHz

audio_dac:
  - platform: es8311
    id: codec
    i2c_id: audio_i2c
    address: 0x18
    use_mclk: true
    # Not "use the microphone": true switches the codec to a PDM digital microphone (REG14 bit 6).
    # This board's MEMS microphone is analog, on the codec's analog input; true reads silence.
    use_microphone: false
    mic_gain: ${mic_gain}
    sample_rate: 48000
    bits_per_sample: 16bit

i2s_audio:
  - id: i2s_bus
    i2s_mclk_pin: GPIO11
    i2s_bclk_pin: GPIO17
    i2s_lrclk_pin:
      number: GPIO3
      ignore_strapping_warning: true

microphone:
  - platform: i2s_audio
    id: mic
    i2s_audio_id: i2s_bus
    adc_type: external
    i2s_din_pin: GPIO4
    pdm: false
    sample_rate: 48000
    bits_per_sample: 16bit
    channel: left  # ES8311 puts the microphone on slot 0
    # A DC bias adds to every squared sample and lifts the quiet readings; take it out first.
    correct_dc_offset: true

# The amplifier stays off: nothing plays, and an idle class-D amplifier is noise in the microphone.
switch:
  - platform: gpio
    id: amp_enable
    pin: GPIO18
    restore_mode: ALWAYS_OFF
    internal: true
