- id: climate-air.status
  revision: 1
  operation: read
  query_type: environment-query.v1
  answer_type: environment.v1
  title_key: meta.assistant.status.title
  description_key: meta.assistant.status.description
  examples_key: meta.assistant.status.examples
  required_facts:
  - role: humidity
    type: number
    units:
    - '%'
    source:
      relation: provides
      id: sensor.<room>_humidity
  optional_facts:
  - role: temperature
    type: number
    units:
    - °C
    source:
      relation: provides
      id: sensor.<room>_temperature
  - role: humidity_alert
    type: state
    units: []
    source:
      relation: provides
      id: binary_sensor.bathroom_humidity_high
  - role: difference
    type: number
    units:
    - °C
    source:
      relation: provides
      id: sensor.indoor_outdoor_difference
  policy:
    evaluator: climate-air.status
  freshness:
    max_age_seconds: 900
    basis: measurement
  limitations:
  - missing_source
  - unknown_freshness
