capabilities:
- id: climate-air.temperature
  revision: 1
  operation: read
  query_type: temperature-query.v1
  answer_type: temperature.v1
  title_key: meta.assistant.temperature.title
  description_key: meta.assistant.temperature.description
  examples_key: meta.assistant.temperature.examples
  required_facts:
  - role: temperature
    type: number
    units:
    - °C
    source:
      relation: provides
      id: sensor.<room>_temperature
  optional_facts: []
  policy:
    evaluator: climate-air.temperature
  freshness:
    max_age_seconds: 900
    basis: measurement
  limitations:
  - missing_source
  - stale
  - invalid_unit
  - unknown_freshness
