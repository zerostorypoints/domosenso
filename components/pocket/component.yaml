# Domosenso component manifest: the pocket, a phone dashboard. One YAML dashboard per language with
# one panel view holding one card, `custom:pocket-app`: the rooms, outside and weather of the home
# inputs and the ids of climate-air's threshold helpers are its config; states come from Home
# Assistant at run time, levels (good / fair / poor) are computed in the card (cards/lib/level.js).
# How a home uses it: README.md; upgrade notes: UPGRADE.md.
id: pocket
version: 0.1.0
summary: A phone dashboard for the home's rooms, lights, climate and air
description_key: meta.description
photo: null
uses_home: true               # the rooms, outside and weather come from the home inputs

devices:
  requires: []

host:
  installs: [container, haos]   # the card is a Lovelace resource
  ha_min: "2026.9"

integrations: []

inputs:
  dashboard_paths:              # reserved / informational: no template reads it; the paths are the ones
                                # registered in configuration.yaml, listed here for the home's notes
    type: "map[lang, string]"   # in configuration.yaml
    default: {en: dashboard-pocket}
    example: {en: dashboard-pocket, pl: dashboard-pocket-pl}
  title:                        # the dashboard's title
    type: string
    default: Home
  floorplan:                    # true: the floorplan component's card on each area page (the area's room) and
    type: bool                  # the floor plan view (#/floorplan, a bar item each person may turn on). Needs
    default: false              # the floorplan component added and its plan pushed (SPEC-028)
    example: true
  plants:                       # true: the home has the plants component, so Plants is on the bottom bar by
    type: bool                  # default (in Media's place). The Plants page finds every plant.* itself; without
    default: false              # the flag it is still offered in Settings, and shows its empty state with no plant
    example: true
  sound:                        # true: a Sound tab inside Media, with audio-sensor's live meter (its card
    type: bool                  # room-meter-card on the music aliases sensor.music_level and
    default: false              # sensor.music_spl_offset). Needs the audio-sensor component added
    example: true
  timers:                       # the timers Controls shows, when the home wants its own list (legacy or manual).
    type: "list[entity_id]"     # Empty: the timers the timers component makes for people, found by their
    default: []                 # timer_role user_countdown; a component's own (the Ramka's controls timer) has none
    example: [timer.domosenso_general]
  sound_averages:               # the home's own Leq sensors (dB SPL) under the meter, one square each; the
    type: "{leq_1_min?, leq_15_min?, leq_1_h?: entity_id}"   # 1 min one is also the meter's marker.
    default: null               # Read only with `sound`; another key fails the render
    example: {leq_1_min: sensor.room_leq_1_min, leq_15_min: sensor.room_leq_15_min, leq_1_h: sensor.room_leq_1_h}

assistant:
  version: 1
  definition: assistant.yaml
  bindings: templates/assistant-bindings.yaml.j2

artifacts:
  templates:
    - templates/assistant-bindings.yaml.j2
    - templates/dashboard.lang.yaml.j2   # -> dashboard.<lang>.yaml, one YAML dashboard per language
  ha_packages: []
  # Served as /local/domosenso/pocket/<version>/: cards/*.js, cards/lib/** and translations/ keep
  # their paths from this directory (tests and cards/testing/ stay behind).
  install_path: www/domosenso/pocket/<version>/
  dashboard_cards:
    - cards/pocket-app.js       # custom:pocket-app, the whole phone view

provides:
  entities: []

# The thresholds the card's levels read; with no climate-air in the home they are missing and the
# card shows no level.
consumes:
  - {component: climate-air, id: "input_number.climate_air_<room>_{temp_low,temp_high}"}
  - {component: climate-air, id: "input_number.climate_air_<room>_{humidity_low,humidity_high}"}
  - {component: climate-air, id: "input_number.climate_air_<reading>_{fair,poor}"}
  # With floorplan: the plan on the area pages and the floor plan view (its options area, zoom, chips,
  # the room-tap and floorplan-status events, layerChips / pressLayer). The card's resource comes
  # with the component.
  - {component: floorplan, id: "dashboard url path floorplan"}
  - {component: floorplan, element: floorplan-card}
  # With sound: Media's Sound tab, audio-sensor's music aliases on its live meter. The card's
  # resource comes with the component.
  - {component: audio-sensor, id: sensor.music_level}
  - {component: audio-sensor, id: sensor.music_spl_offset}
  - {component: audio-sensor, element: room-meter-card}
  # With plants: the Plants page reads every plant.* the plants component sets up, its readings'
  # sensors and its bands (found at run time, the ids are not configured).
  - {component: plants, id: "plant.<plant>"}
  - {component: plants, id: "sensor.<plant>_{moisture,conductivity,illuminance,temperature,battery}"}
  - {component: plants, id: "sensor.<plant>_illuminance_max_24h"}

tested:
  ha: ["2026.9.2"]              # check_config on the demo home (tools/ha-check.sh pocket)
  homes: 0                      # no home has run 0.1.0 yet
local_only: true
