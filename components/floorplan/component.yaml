# Domosenso component manifest (SPEC-028): a floor plan of the home. One card, `floorplan-card`, draws
# the rooms as polygons from the plan document (schemas/floorplan.schema.json, schema 1) and puts
# sensor readings and plants at their positions; in edit mode it moves points and reshapes rooms.
# No inputs, no Home Assistant package: the plan lives in the `floorplan` storage dashboard, written by
# `domosenso floorplan push` or the card's editor. How a home uses it: README.md.
id: floorplan
version: 0.4.0
summary: A floor plan of the home with rooms, sensor readings and plants at their positions
description_key: meta.description
photo: null

devices:
  requires: []

host:
  installs: [container, haos]             # container = no apps; the card is a Lovelace resource
  ha_min: "2026.9"

integrations:
  - {name: lovelace, source: core}

assistant:
  version: 1
  definition: assistant.yaml
  bindings: templates/assistant-bindings.yaml.j2

artifacts:
  templates: [templates/assistant-bindings.yaml.j2]
  ha_packages: []
  # Served as /local/domosenso/floorplan/<version>/: cards/*.js, cards/lib/** and translations/ keep
  # their paths from this directory (tests and cards/testing/ stay behind).
  install_path: www/domosenso/floorplan/<version>/
  dashboard_cards:
    - cards/floorplan-card.js             # rooms, points, zoom and pan; edit mode for admins

provides:                                 # contract surface (SPEC-028)
  surfaces:
    - {id: "schemas/floorplan.schema.json", stability: stable, note: "schema 1; a breaking change bumps `schema`; readers refuse an unknown major"}
    - {id: "dashboard url path floorplan", stability: stable, note: "storage mode; one view, one custom:floorplan-card"}
    - {id: "custom:floorplan-card", stability: stable, note: "config plan (the document; optional: without it the card reads the floorplan dashboard), floor (floor_id to show), edit (true: edit button shown to admins; default true), values (true: current readings on points; default true), layers, layer_choice (one), maps (true: maps on the plants, climate and light layers; default true), fill (true: as tall as the screen below the card's top), sound_rt60 (the sound maps' mid-band RT60, seconds; Amendment 8); edit false for embedding"}
    - {id: "card behaviour", stability: additive-only, note: "zoom (wheel, pinch, + / - / fit), pan; edit mode: drag points (sets placed true), drag / add / remove room corners, split a room by a line, join two rooms, mark rooms as one open space (the Open tool; Close off), link a room to an area or create one; a tray of point entities without a position (temperature, humidity, illuminance, moisture, carbon_dioxide, pm25 and plant.*; computed platforms such as template and statistics left out; no search), grouped by room, a group draggable as a whole (placed false); corners snap to a 0.05 m grid unless they join another room; edit mode shows a grid, room areas and the selected room's wall lengths; save with lovelace/config/save; split and join change only shapes, never delete an area or move a device between areas; view mode with plants, climate or light shown alone: their maps (Amendment 7), interpolated inside each room, now or the 24-hour figure from recorder/statistics_during_period; with layer_choice one the bar and the chips carry data-own-tap; media shown alone with an audio sensor placed: live sound maps (level, loudness, room effect, bass) over its room or open space from the floor's speakers through a room model (Amendment 8)"}
    - {id: "skill floorplan-from-image", stability: stable, note: "its name; traces rooms from an image or SVG, asks one known length for the scale, matches areas, writes domosenso/floorplan.json and domosenso/floorplan/<floor>.<ext>, then floorplan push"}

consumes: []

tested:
  ha: ["2026.9.2"]
  homes: 0                                # staging trial pending: no home has run 0.1.0 yet
local_only: true
