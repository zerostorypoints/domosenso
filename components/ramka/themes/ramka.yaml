# Themes for the Ramka; installed as /config/themes/ramka.yaml, loaded by `frontend: themes:
# !include_dir_merge_named themes`. HA's charts take series N from --graph-color-N, and
# rooms-card.js colours a room's temperature from the same variable (the climate input's
# `color: N`, by default the room's position), so a tile and its line on the 7-day chart match.
# Eleven bright colours that read on the dark background; the default palette's brown (#9c6b4e)
# and grey (#9498a0) did not.
#
# `ramka`: only the series colours, per mode (the Ramka's view theme until 0.3.0; kept for any
# other dashboard that names it). `ramka-dark`, `ramka-light` (0.4.0): the server's default theme,
# set by the automation <prefix>_theme_mode from input_select.<prefix>_theme_mode, without `modes:`
# so the look does not follow the browser's own dark-mode setting.
#
# Source: Home Assistant 2026.9.2 ships home-assistant-frontend 20260826.7 (core
# homeassistant/components/frontend/manifest.json at tag 2026.9.2). In that frontend
# (src/state/themes-mixin.ts) a theme without `modes:` always runs in light mode, and in dark mode
# the frontend lays darkColorStyles (src/resources/theme/color/color.globals.ts) and
# darkSemanticColorStyles (src/resources/theme/color/semantic.globals.ts) over its light defaults
# (src/common/dom/apply_themes_on_element.ts). So:
# - ramka-light: the light defaults are the frontend's own; only the light series colours;
# - ramka-dark: every variable of those two dark blocks, copied from tag 20260826.7 in their
#   order, then the dark series colours. A newer frontend may add dark variables; copy them again
#   when Home Assistant's pinned version moves.
ramka:
  graph-color-1: "#5b8def"
  graph-color-2: "#f5c542"
  graph-color-3: "#ff7a5c"
  graph-color-4: "#4fd1b5"
