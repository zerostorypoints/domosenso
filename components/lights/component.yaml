# Domosenso component manifest: Philips Hue lights per room, through the bridge's room groups; from
# 0.2.0 a package with room lights that follow the bulbs, a lights-on count and the lowest battery
# (SPEC-008).
id: lights
version: 0.5.0
summary: Philips Hue lights per room, from the bridge's room groups
description_key: meta.description
photo: null

devices:
  requires:
    - kind: hue-bridge
      recommend: [hue-bridge]
      count: 1
  supports: [hue-bulbs, hue-accessories]

host:
  installs: [container, haos]
  ha_min: "2026.9"

integrations:
  - {name: hue, source: core, setup: "press the button on the bridge when Home Assistant asks; it then talks to the bridge on the home network"}
  - {name: template, source: core}
  # 0.5.0, only with presence_rooms.
  - {name: statistics, source: core}
  - {name: input_boolean, source: core}
  - {name: automation, source: core}
  - {name: logbook, source: core}

inputs:
  lights:                       # the Ramka's room tiles read these
    type: "list[{entity, label, room?}]"
    example: [{entity: light.living_room, label: Living room}]
  lights_all_off:
    type: entity_id
    default: null
    example: scene.all_lights_off
  rooms:                        # 0.2.0: one template light per Hue room group; id defaults to the group's object id
    type: "list[{group, name, id?}]"
    default: []
    example: [{group: light.living_room, name: Living room}]
  battery_sensors:              # 0.2.0: the Hue accessories' battery sensors; none, no battery sensor
    type: "list[entity_id]"
    default: []
    example: [sensor.hall_motion_sensor_battery]
  presence_rooms:               # 0.5.0 (SPEC-053): a room's light follows presence; one automation per entry
    type: "list[{group, name, presence, illuminance?, dark_below?, off_after?, distance?, id?}]"
    default: []
    example: [{group: light.office, name: Office, presence: binary_sensor.office_presence, illuminance: sensor.office_illuminance, dark_below: 15, off_after: "00:03:00"}]

assistant:
  version: 1
  definition: assistant.yaml
  bindings: templates/assistant-bindings.yaml.j2

assistant_actions:
  version: 1
  definition: assistant-actions.yaml
  bindings: templates/assistant-actions-bindings.yaml.j2

artifacts:
  templates:
    - templates/assistant-actions-bindings.yaml.j2
    - templates/assistant-bindings.yaml.j2
    - templates/package.yaml.j2   # -> packages/lights.yaml
  ha_packages: []
  services: []

provides:
  # Legacy entries include integration-owned sources, retained for compatibility.
  entities:
    - {id: "light.<room>", stability: stable, note: "one per Hue room group; on, off, brightness"}
    - {id: "light.<bulb>", stability: stable, note: "one per bulb. A room group stays on while its bulbs have lost power (a wall switch cut them), so read the bulbs where that can happen"}
    # From the package (0.2.0); every entity carries component: lights.
    - {id: "light.room_<id>", unique_id: "room_<id>", stability: stable, note: "on only while a reachable bulb of the group is on; commands go to the group"}
    - {id: sensor.lights_on, unique_id: lights_on_count, stability: stable, note: "Hue bulbs that are on, groups excluded"}
    - {id: sensor.hue_lowest_battery, unique_id: hue_lowest_battery, stability: stable, note: "%, unavailable while no battery sensor has a value; with battery_sensors"}
    # Presence rooms (0.5.0, SPEC-053), per entry of presence_rooms.
    - {id: "automation.lights_presence_<id>", unique_id: "lights_presence_<id>", stability: stable, note: "switches the room on at entry in the dark and off after off_after without presence; switch it off to pause the room"}
    - {id: "automation.lights_presence_<id>_start", unique_id: "lights_presence_<id>_start", stability: stable, note: "after a restart, switches off a lit empty room once off_after has passed"}
    - {id: "input_boolean.lights_presence_<id>_hold", stability: stable, note: "on after a switch-off by hand in an occupied room, off once it has been empty for off_after"}
    - {id: "sensor.lights_presence_<id>_ambient", unique_id: "lights_presence_<id>_ambient", stability: stable, note: "the illuminance while no bulb of the group is on, held while one is; with illuminance"}
    - {id: "sensor.lights_presence_<id>_illuminance", unique_id: "lights_presence_<id>_illuminance", stability: stable, note: "statistics median of the ambient sensor over 2 minutes; with illuminance. A statistics sensor, so it carries no component attribute"}
    - {id: "sensor.lights_presence_<id>_last_distance", unique_id: "lights_presence_<id>_last_distance", stability: stable, note: "the last distance seen while presence was on; with distance"}

  upstream:
    - {id: "light.<room>", owner: integration}
    - {id: "light.<bulb>", owner: integration}

consumes: []

tested:
  ha: ["2026.9.2"]
  homes: 1
local_only: true
