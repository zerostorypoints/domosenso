# Domosenso component manifest — pilot of docs/research/2026-10-20-domosenso-architecture.md §3.2,
# first filled from a real home on 2026-10-20. Fields marked "pilot:" are additions the format
# needed; see docs/pilot-bermuda-presence.md.
id: bermuda-presence
version: 0.1.0
summary: Room-level presence of phones, tablets and watches from BLE, through ESPHome proxies and Bermuda
description_key: meta.description
photo: null

devices:
  requires:
    - kind: ble-proxy
      recommend: [m5stack-atom-lite]
      count: "1 per room"                 # rooms without one get no presence (Bermuda puts the device in the nearest room that has one)
      power: "5 V USB, plain supply"      # pilot: a PD / Quick Charge port cuts an Atom off below its threshold (docs/pilot-bermuda-presence.md)
  supports: [iphone, ipad, apple-watch]   # through Private BLE Device (IRK)
  optional:                               # pilot: hardware that enables a feature
    - kind: mmwave-radar
      recommend: [hlk-ld2410c]
      feature: radar

host:
  installs: [container, haos]             # container = no apps; nothing here needs a service
  ha_min: "2026.9"                        # pilot: template blueprints + the versions tested below

integrations:
  - {name: esphome, source: core}
  - {name: private_ble_device, source: core, setup: "one entry per Apple device, IRK from the macOS keychain or a capture node"}
  - {name: bermuda, source: hacs, repo: agittins/bermuda, tested: "0.8.7"}   # tested with a manual install, HACS was not installed

# pilot: values the home supplies; `domosenso add` asks for them and writes the instance files.
inputs:
  rooms:                                  # HA area names, one sensor each; a room starts working when it gets a proxy
    type: "list[area_name]"
    example: [Living room, Dining, Kitchen, Office, Bedroom, Kids' room, Hall]
  phones:                                 # Bermuda area sensor -> person; a phone follows its owner
    type: "map[entity_id, name]"
    example: {sensor.alex_phone_area: Alex, sensor.sam_phone_area: Sam}
  tablets:                                # same, but a tablet lies where it was left: shown in brackets
    type: "map[entity_id, name]"
    default: {}
    example: {sensor.family_tablet_area: Sam}
  proxies:                                # one device file each; `room` is the hostname slug
    type: "list[{room: slug, area: area_name, radar: bool}]"
    example: [{room: living-room, area: Living room, radar: false}, {room: dining, area: Dining, radar: true}]
  offline_notify:                         # who hears that a proxy is gone
    type: action
    example: notify.mobile_app_alex_phone
  minutes:                                # how long a proxy may stay unavailable before the notification
    type: int
    default: 10

artifacts:
  esphome:
    packages:                             # remote packages, github://domosenso/domosenso/components/bermuda-presence/esphome/<file>@bermuda-presence/<version>
      - {file: esphome/ble-proxy.yaml, project: domosenso.bermuda-presence}
      - {file: esphome/ld2410.yaml, feature: radar}
    factory: esphome/ble-proxy.factory.yaml   # pilot: Improv + dashboard_import, for boards nobody configured yet
    instance: examples/demo-home/esphome/ble-proxy-<room>.yaml   # pilot: the thin per-device file the CLI writes once; the home owns it
  ha_blueprints:                          # pilot: managed, copied to blueprints/<domain>/domosenso/
    - ha/blueprints/template/domosenso/presence_room.yaml
    - ha/blueprints/automation/domosenso/ble_proxy_offline.yaml
  ha_packages: []                         # nothing generic is left once the repetition lives in blueprints
  ha_instance: examples/demo-home/ha/packages/bermuda_presence.yaml   # pilot: written once from inputs, owned by the home
  dashboard_cards: [cards/presence-rooms.yaml]
  services: []

provides:                                 # contract surface; placeholders in <> come from inputs
  entities:
    - {id: "sensor.presence_<area slug>", stability: stable, from: ha_instance,
       state: "names joined by ', ', tablet-only people in brackets, '-' when empty",
       attributes: {component: bermuda-presence, area: "<area name>"}}
    - {id: "light.<area slug>_ble_proxy_<room>_led", stability: stable, from: esphome,
       note: "id built by HA from the ESPHome area + friendly name, not by this component"}
    - {id: "sensor.<area slug>_ble_proxy_<room>_wi_fi_signal", stability: stable, from: esphome, note: same}
    - {id: "automation.ble_proxy_offline", stability: additive-only, from: ha_instance}
  events:
    - {type: esphome.atom_button, data: {room: "<room>", click: [single, double, long]}, stability: frozen, from: esphome}
  features:
    radar:
      entities:
        - {id: "binary_sensor.<area slug>_ble_proxy_<room>_presence", stability: stable}
        - {id: "sensor.<area slug>_ble_proxy_<room>_detection_distance", stability: stable}
        - {id: "sensor.<area slug>_ble_proxy_<room>_movement", stability: additive-only}
  # Entities another integration owns, which this component's own files read. Not ours to freeze,
  # but a Bermuda upgrade that renames them breaks the instance: pilot: listed so CI can check them.
  upstream:
    - {id: "sensor.<device>_area", owner: bermuda}
    - {id: "sensor.bermuda_global_active_proxy_count", owner: bermuda}

consumes: []

tested:
  ha: ["2026.9.2"]                        # check_config + ha-staging, 2026-10-20
  esphome: ["2026.9.1"]                   # config of every file; compile of three device files (one with radar) and the factory image
  homes: 1
local_only: true
