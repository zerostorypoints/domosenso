capabilities:
- id: media.now_playing
  revision: 1
  operation: read
  query_type: media-query.v1
  answer_type: media.v1
  title_key: meta.assistant.now_playing.title
  description_key: meta.assistant.now_playing.description
  examples_key: meta.assistant.now_playing.examples
  required_facts:
  - role: player
    type: state
    units: []
    source:
      relation: upstream
      id: media_player.<player>
  optional_facts:
  - role: quality
    type: state
    units: []
    source:
      relation: upstream
      id: sensor.<quality>
  - role: service
    type: state
    units: []
    source:
      relation: upstream
      id: sensor.<service>
  policy:
    evaluator: media.now_playing
  freshness:
    max_age_seconds: null
    basis: reported_state
  limitations:
  - missing_source
