  description_key: meta.assistant.status.description
  examples_key: meta.assistant.status.examples
  required_facts:
  - role: cover
    type: state
    units: []
    source:
      relation: provides
      id: cover.<awning>
  optional_facts:
  - role: wind
    type: state
    units: []
    source:
      relation: provides
      id: binary_sensor.<wind>
  - role: last_heard
    type: event
    units: []
    source:
      relation: provides
      id: input_datetime.<wind_last_heard.id>
  policy:
    evaluator: awnings.status
  freshness:
    max_age_seconds: null
