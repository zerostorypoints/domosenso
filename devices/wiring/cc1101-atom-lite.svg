<g><rect x='860' y='262' width='26' height='18' fill='#c9a227' stroke='#7a6312'/><line x1='886' y1='271' x2='950' y2='271' stroke='#333' stroke-width='7' stroke-linecap='round'/><text x='918' y='300' text-anchor='middle' font-size='13' fill='#333'>SMA</text><text x='918' y='318' text-anchor='middle' font-size='13' fill='#333'>433 MHz</text><text x='918' y='336' text-anchor='middle' font-size='13' fill='#333'>antenna</text></g>
<text x='40' y='518' font-size='14' fill='#333'>Pinout of the E07-M1101D as the ESPSomfy-RTS wiki gives it; the right column is ESPSomfy's Radio page.</text>
<text x='40' y='540' font-size='14' fill='#333'>Screw the 433 MHz antenna onto the module's SMA socket before the node transmits.</text>
<text x='40' y='562' font-size='14' fill='#333'>The Atom's 5V and the Grove port stay free. Colours are a convention, not printed on any part.</text>
</svg>
