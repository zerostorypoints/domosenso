<rect x="675" y="695" width="245" height="65" rx="4" fill="#172b40"/>
<text x="697" y="720" style="fill:#d9edf4">SSD1306 128×64</text><text x="697" y="747" style="fill:#d9edf4">Optional • I2C 0x3C</text>
<circle cx="980" cy="250" r="5" fill="#c54444"/><circle cx="910" cy="610" r="5" fill="#414a54"/>
<text x="650" y="812" class="small">Follow OLED labels, not connector order.</text>
