id: m5stack-atom-lite
names: {en: M5Stack Atom Lite, de: M5Stack Atom Lite, pl: M5Stack Atom Lite}
description_key: meta.devices.m5stack-atom-lite.description
does_key: meta.devices.m5stack-atom-lite.does
photo: null
component: bermuda-presence
tested: {homes: 1}  # the maintainer's home (SPEC-011)
# SPEC-010. Seen on HA 2026.9.2: ESPHome reports the board, manufacturer Espressif, model
# m5stack-atom (the Atom Lite, Matrix and Echo share it); ESPSomfy-RTS over MQTT names the board in
# its model. The catalog's firmware sets `project: domosenso.<component>`, which ESPHome reports as
# manufacturer domosenso instead (inference, from ESPHome's device info).
match:
  - integration: esphome
    model: "m5stack-atom*"
  - integration: esphome
    manufacturer: domosenso
    model: bermuda-presence
    note: inference
  - integration: [mqtt, espsomfy_rts]
    manufacturer: "rstrouse*"
    model: "*M5Stack Atom Lite*"
# SPEC-040: lettered as on the drawing; one value per dimension, the source it was read from.
dimensions:
  drawing: devices/dimensions/m5stack-atom-lite.svg
  items:
    - key: A
      label: Body, width × depth × height
      value: [24, 24, 9.5]
      source: manufacturer
      ref: https://docs.m5stack.com/en/core/ATOM%20Lite
      checked: "2026-11-07"
      note: "Caliper, 2026-11-07: 9 to 10 mm high. Official model: https://github.com/m5stack/M5_Hardware/tree/master/Products/C008_Atom-Lite (not measured from)."
    - key: B
      label: USB-C axis below the button face
      value: [2.15]
      tolerance: 0.2
      source: manufacturer
      ref: https://m5stack.oss-cn-shenzhen.aliyuncs.com/resource/docs/products/core/ATOM%20Lite/model%20size.jpg
      checked: "2026-11-05"
      note: Measured from the pixels of M5Stack's raster model-size drawing.
    - key: C
      label: Header socket centres from the side edges
      value: [4.5]
      tolerance: 0.2
      source: manufacturer
      ref: https://m5stack.oss-cn-shenzhen.aliyuncs.com/resource/docs/products/core/ATOM%20Lite/model%20size.jpg
      checked: "2026-11-05"
      note: Measured from the pixels of M5Stack's raster model-size drawing.
    - key: D
      label: Header socket rows from the face opposite the USB-C, first × last
      value: [9.5, 19.6]
      tolerance: 0.2
      source: manufacturer
      ref: https://m5stack.oss-cn-shenzhen.aliyuncs.com/resource/docs/products/core/ATOM%20Lite/model%20size.jpg
      checked: "2026-11-05"
      note: Measured from the pixels of M5Stack's raster model-size drawing; rows at a 2.54 mm pitch.
    - key: E
      label: Button cap, square
      value: [13]
      approximate: true
      source: caliper
      checked: "2026-11-07"
