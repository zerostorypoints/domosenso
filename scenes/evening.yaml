# Dinner and music: the lights are on, the family calendar shows the dinner, the speaker plays, and
# the tablet shows what is playing.
id: evening
time: "20:00"
names: {en: Evening, de: Abend, pl: Wieczór}
states:
  weather.forecast_home: clear-night
  sensor.outside_temperature: 11.9
  sensor.outside_humidity: 74
  light.dining: "on"
  light.living_room: "on"
  light.kitchen: "on"
  light.hall: "off"
  media_player.living_room_speaker: playing
  sensor.media_plug_power: 31.6
  sensor.media_plug_voltage: 230
  binary_sensor.dining_ble_proxy_dining_presence: "on"
  sensor.dining_ble_proxy_dining_detection_distance: 120
  lock.front_door: locked
  calendar.family: "on"
  cover.awning_living_room: closed
  cover.awning_kitchen: closed
tablet: {mode: ambient}
components: [bermuda-presence, calendar, lights, media, ramka, weather]
devices: [hegel-h400, hlk-ld2410c, hue-bridge, m5stack-atom-lite, tcl-9469x]
