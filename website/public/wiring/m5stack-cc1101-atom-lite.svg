<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="1220" viewBox="0 0 1100 1220" font-family="Helvetica, Arial, sans-serif" font-size="15">
  <style>
    .w{fill:none;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
    .box{fill:#fff;stroke:#333;stroke-width:1.6}
    .panel{fill:#f4f7fb;stroke:#9fb3c8;stroke-width:1.4}
    .lbl{font-size:13px;fill:#333}
    .small{font-size:12px;fill:#555}
    .wt{font-size:12px;fill:#fff}
    .title{font-size:22px;font-weight:700;fill:#111}
    .h2{font-size:17px;font-weight:700;fill:#111}
    .sub{font-size:14px;fill:#555}
    .warn{font-size:13px;fill:#c0392b}
    .pin{fill:#777}
    .hole{fill:#2b2b2b}
    .on{fill:#222}
    .off{fill:#fff;stroke:#222;stroke-width:1.2}
  </style>
  <rect width="1100" height="1220" fill="#fafafa"/>

  <text x="40" y="44" class="title">M5Stack Module CC1101 (868 MHz) on an M5Stack Atom Lite</text>
  <text x="40" y="68" class="sub">As they lie on the desk: the module pin side up (antenna at the top), the Atom from above (USB-C at the bottom).</text>

  <!-- Panel A -->
  <rect x="24" y="88" width="1052" height="604" rx="10" class="panel"/>
  <text x="330" y="116" class="h2">1. Eight jumpers: female end on the module pin, male end in the Atom socket</text>

  <!-- CC1101 module, pin side -->
  <rect x="250" y="112" width="40" height="28" rx="3" fill="#c9a227" stroke="#7a5f10"/>
  <rect x="257" y="84" width="26" height="32" rx="8" fill="#d62d20"/>
  <text x="244" y="104" class="small" text-anchor="end">antenna (SMA)</text>
  <rect x="60" y="138" width="470" height="512" rx="18" fill="#1d1d1d" stroke="#555" stroke-width="2"/>
  <circle cx="86" cy="164" r="8" fill="#888"/><circle cx="504" cy="164" r="8" fill="#888"/>
  <circle cx="86" cy="624" r="8" fill="#888"/><circle cx="504" cy="624" r="8" fill="#888"/>
  <text x="84" y="330" font-size="56" font-weight="700" fill="#fff">M5</text>
  <rect x="90" y="370" width="150" height="110" rx="16" fill="none" stroke="#fff" stroke-width="2"/>
  <text x="106" y="412" font-size="22" font-weight="700" fill="#fff">RF</text>
  <text x="106" y="438" font-size="16" font-weight="700" fill="#fff">MODULE</text>
  <text x="106" y="460" class="wt">CC1101</text>

  <!-- header strip and pins: inner column x=448 (even), edge column x=482 (odd), rows y=200+26*(r-1) -->
  <rect x="432" y="184" width="66" height="396" rx="4" fill="#0c0c0c" stroke="#444"/>
  <g class="pin">
    <circle cx="448" cy="200" r="4"/><circle cx="448" cy="226" r="4"/><circle cx="448" cy="252" r="4"/><circle cx="448" cy="278" r="4"/><circle cx="448" cy="304" r="4"/>
    <circle cx="448" cy="330" r="4"/><circle cx="448" cy="356" r="4"/><circle cx="448" cy="382" r="4"/><circle cx="448" cy="408" r="4"/><circle cx="448" cy="434" r="4"/>
    <circle cx="448" cy="460" r="4"/><circle cx="448" cy="486" r="4"/><circle cx="448" cy="512" r="4"/><circle cx="448" cy="538" r="4"/><circle cx="448" cy="564" r="4"/>
    <circle cx="482" cy="200" r="4"/><circle cx="482" cy="226" r="4"/><circle cx="482" cy="252" r="4"/><circle cx="482" cy="278" r="4"/><circle cx="482" cy="304" r="4"/>
    <circle cx="482" cy="330" r="4"/><circle cx="482" cy="356" r="4"/><circle cx="482" cy="382" r="4"/><circle cx="482" cy="408" r="4"/><circle cx="482" cy="434" r="4"/>
    <circle cx="482" cy="460" r="4"/><circle cx="482" cy="486" r="4"/><circle cx="482" cy="512" r="4"/><circle cx="482" cy="538" r="4"/><circle cx="482" cy="564" r="4"/>
  </g>

  <!-- Atom Lite, top view -->
  <rect x="820" y="288" width="160" height="184" rx="20" fill="#d3d6d8" stroke="#8a8f93" stroke-width="2"/>
  <rect x="822" y="300" width="20" height="138" rx="3" fill="#111"/>
  <rect x="958" y="328" width="20" height="110" rx="3" fill="#111"/>
  <g class="hole">
    <rect x="827" y="307" width="10" height="10"/><rect x="827" y="335" width="10" height="10"/><rect x="827" y="363" width="10" height="10"/><rect x="827" y="391" width="10" height="10"/><rect x="827" y="419" width="10" height="10"/>
    <rect x="963" y="335" width="10" height="10"/><rect x="963" y="363" width="10" height="10"/><rect x="963" y="391" width="10" height="10"/><rect x="963" y="419" width="10" height="10"/>
  </g>
  <g class="lbl" font-weight="700">
    <text x="848" y="317">3V3</text><text x="848" y="345">G22</text><text x="848" y="373">G19</text><text x="848" y="401">G23</text><text x="848" y="429">G33</text>
    <text x="952" y="345" text-anchor="end">G21</text><text x="952" y="373" text-anchor="end">G25</text><text x="952" y="401" text-anchor="end">5V</text><text x="952" y="429" text-anchor="end">G</text>
  </g>
  <rect x="876" y="300" width="50" height="22" rx="3" fill="#fff" stroke="#999"/>
  <text x="884" y="316" font-size="11" font-weight="700" fill="#222">ATOM</text>
  <rect x="876" y="444" width="48" height="20" rx="3" fill="#f2efe6" stroke="#999"/>
  <text x="881" y="458" font-size="10" fill="#555">Grove</text>
  <rect x="884" y="472" width="32" height="10" rx="3" fill="#888"/>
  <text x="922" y="484" font-size="10" fill="#555">USB-C</text>

  <!-- wires (drawn under the pin markers) -->
  <path class="w" stroke="#2f7fd3" d="M482 278 C 640 278, 690 396, 832 396"/>
  <path class="w" stroke="#2e9e3a" d="M482 304 C 640 304, 690 368, 832 368"/>
  <path class="w" stroke="#d4a017" d="M482 330 C 640 330, 700 424, 832 424"/>
  <path class="w" stroke="#8e44ad" d="M448 434 C 520 474, 660 340, 832 340"/>
  <path class="w" stroke="#e67e22" d="M448 278 C 470 236, 560 228, 640 228 L 985 228 Q 1000 228 1000 243 L 1000 340 L 968 340"/>
  <path class="w" stroke="#222" d="M482 200 C 560 200, 600 250, 600 320 L 600 474 Q 600 492 618 492 L 980 492 Q 995 492 995 477 L 995 424 L 968 424"/>
  <path class="w" stroke="#c0392b" d="M448 538 C 520 538, 560 512, 640 512 L 995 512 Q 1010 512 1010 497 L 1010 396 L 968 396"/>
  <path fill="none" stroke="#666" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" d="M448 460 C 500 520, 560 532, 640 532 L 1010 532 Q 1025 532 1025 517 L 1025 368 L 968 368"/>
  <path fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" d="M448 460 C 500 520, 560 532, 640 532 L 1010 532 Q 1025 532 1025 517 L 1025 368 L 968 368"/>

  <!-- used pins and holes, coloured -->
  <g stroke="#fff" stroke-width="1.5">
    <circle cx="482" cy="200" r="7" fill="#222"/>
    <circle cx="482" cy="278" r="7" fill="#2f7fd3"/>
    <circle cx="482" cy="304" r="7" fill="#2e9e3a"/>
    <circle cx="482" cy="330" r="7" fill="#d4a017"/>
    <circle cx="448" cy="278" r="7" fill="#e67e22"/>
    <circle cx="448" cy="434" r="7" fill="#8e44ad"/>
    <circle cx="448" cy="460" r="7" fill="#fff" stroke="#666"/>
    <circle cx="448" cy="538" r="7" fill="#c0392b"/>
  </g>
  <g stroke="#fff" stroke-width="1.2">
    <rect x="825" y="333" width="14" height="14" fill="#8e44ad"/>
    <rect x="825" y="361" width="14" height="14" fill="#2e9e3a"/>
    <rect x="825" y="389" width="14" height="14" fill="#2f7fd3"/>
    <rect x="825" y="417" width="14" height="14" fill="#d4a017"/>
    <rect x="961" y="333" width="14" height="14" fill="#e67e22"/>
    <rect x="961" y="361" width="14" height="14" fill="#fff" stroke="#666"/>
    <rect x="961" y="389" width="14" height="14" fill="#c0392b"/>
    <rect x="961" y="417" width="14" height="14" fill="#222"/>
  </g>

  <!-- pin labels, left of the header, one per used row -->
  <g class="wt" text-anchor="end">
    <text x="424" y="204">pin 1 · GND</text>
    <text x="424" y="282">pin 8 · CSN | pin 7 · MOSI</text>
    <text x="424" y="308">pin 9 · MISO</text>
    <text x="424" y="334">pin 11 · SCK</text>
    <text x="424" y="438">pin 20 · GDO0</text>
    <text x="424" y="464">pin 22 · GDO2</text>
    <text x="424" y="542">pin 28 · 5V</text>
  </g>
  <text x="84" y="566" class="wt">Column at the board edge: pins 1, 3 … 29</text>
  <text x="84" y="584" class="wt">(pin 1 at the top, by the antenna)</text>
  <text x="84" y="602" class="wt">Inner column: pins 2, 4 … 30</text>

  <text x="560" y="600" class="lbl">The columns follow the "5V" arrow printed on the module:</text>
  <text x="560" y="618" class="lbl">it points at the inner column's 14th pin from the top, pin 28.</text>
  <text x="560" y="642" class="warn">Power from the Atom's 5V socket, not 3V3: the module has its</text>
  <text x="560" y="660" class="warn">own 5 V → 3.3 V regulator (VRH330, printed on the board).</text>
  <text x="44" y="682" class="small">The Atom sockets and colours are those of cc1101-atom-lite.svg (the 433 MHz module). The 3V3 socket and the Grove port stay free.</text>

  <!-- Panel B: table -->
  <rect x="24" y="708" width="1052" height="196" rx="10" class="panel"/>
  <text x="44" y="736" class="h2">2. The same as a table</text>
  <g class="lbl">
    <text x="60" y="766" font-weight="700">Atom</text><text x="140" y="766" font-weight="700">module</text><text x="230" y="766" font-weight="700">wire</text><text x="360" y="766" font-weight="700">signal</text>
    <text x="60" y="792">5V</text><text x="140" y="792">pin 28 "5V"</text><text x="230" y="792">red</text><text x="360" y="792">power</text>
    <text x="60" y="816">G</text><text x="140" y="816">pin 1 "GND"</text><text x="230" y="816">black</text><text x="360" y="816">ground</text>
    <text x="60" y="840">G23</text><text x="140" y="840">pin 7 "23"</text><text x="230" y="840">blue</text><text x="360" y="840">SPI MOSI</text>
    <text x="60" y="864">G19</text><text x="140" y="864">pin 9 "19"</text><text x="230" y="864">green</text><text x="360" y="864">SPI MISO</text>

    <text x="580" y="766" font-weight="700">Atom</text><text x="660" y="766" font-weight="700">module</text><text x="750" y="766" font-weight="700">wire</text><text x="880" y="766" font-weight="700">signal</text>
    <text x="580" y="792">G33</text><text x="660" y="792">pin 11 "18"</text><text x="750" y="792">yellow</text><text x="880" y="792">SPI clock</text>
    <text x="580" y="816">G21</text><text x="660" y="816">pin 8 "25"</text><text x="750" y="816">orange</text><text x="880" y="816">CS</text>
    <text x="580" y="840">G22</text><text x="660" y="840">pin 20 "5"</text><text x="750" y="840">purple</text><text x="880" y="840">GDO0, transmit</text>
    <text x="580" y="864">G25</text><text x="660" y="864">pin 22 "13"</text><text x="750" y="864">white</text><text x="880" y="864">GDO2, receive</text>
  </g>
  <text x="44" y="892" class="small">In quotes: the label next to that pin on the module's top side. Each pin goes through the board: a socket on top, a pin underneath.</text>

  <!-- Panel C: DIP + pin 1 check -->
  <rect x="24" y="920" width="1052" height="236" rx="10" class="panel"/>
  <text x="44" y="948" class="h2">3. DIP switches and finding pin 1</text>

  <text x="60" y="980" font-weight="700">SW1 · CSN</text>
  <g>
    <rect x="60" y="992" width="34" height="64" rx="4" class="box"/><rect x="66" y="998" width="22" height="24" class="on"/>
    <rect x="100" y="992" width="34" height="64" rx="4" class="box"/><rect x="106" y="1026" width="22" height="24" class="off"/>
    <rect x="140" y="992" width="34" height="64" rx="4" class="box"/><rect x="146" y="1026" width="22" height="24" class="off"/>
    <rect x="180" y="992" width="34" height="64" rx="4" class="box"/><rect x="186" y="1026" width="22" height="24" class="off"/>
  </g>
  <g class="lbl"><text x="72" y="1076">1</text><text x="112" y="1076">2</text><text x="152" y="1076">3</text><text x="192" y="1076">4</text></g>
  <text x="60" y="1100" class="lbl">1 ON: CSN on pin 8</text>

  <text x="290" y="980" font-weight="700">SW2 · GDO2 (1–3), GDO0 (4–6)</text>
  <g>
    <rect x="290" y="992" width="34" height="64" rx="4" class="box"/><rect x="296" y="1026" width="22" height="24" class="off"/>
    <rect x="330" y="992" width="34" height="64" rx="4" class="box"/><rect x="336" y="998" width="22" height="24" class="on"/>
    <rect x="370" y="992" width="34" height="64" rx="4" class="box"/><rect x="376" y="1026" width="22" height="24" class="off"/>
    <rect x="410" y="992" width="34" height="64" rx="4" class="box"/><rect x="416" y="1026" width="22" height="24" class="off"/>
    <rect x="450" y="992" width="34" height="64" rx="4" class="box"/><rect x="456" y="1026" width="22" height="24" class="off"/>
    <rect x="490" y="992" width="34" height="64" rx="4" class="box"/><rect x="496" y="998" width="22" height="24" class="on"/>
  </g>
  <g class="lbl"><text x="302" y="1076">1</text><text x="342" y="1076">2</text><text x="382" y="1076">3</text><text x="422" y="1076">4</text><text x="462" y="1076">5</text><text x="502" y="1076">6</text></g>
  <text x="290" y="1100" class="lbl">2 ON: GDO2 on pin 22 · 6 ON: GDO0 on pin 20</text>
  <text x="60" y="1126" class="small">All others OFF. The switches are on the board's top side; ON is the side printed "ON".</text>
  <text x="60" y="1142" class="small">The table printed beside them (column Core) agrees: CSN 1 = G25, GD02 2 = G13, GD00 6 = G5.</text>

  <text x="620" y="980" font-weight="700">Pin 1, before power</text>
  <text x="620" y="1004" class="lbl">Multimeter on continuity, one probe on the gold</text>
  <text x="620" y="1022" class="lbl">antenna socket. The top three pins of the column at</text>
  <text x="620" y="1040" class="lbl">the board edge (1, 3, 5) must beep.</text>
  <text x="620" y="1064" class="lbl">If the inner column beeps instead: swap the</text>
  <text x="620" y="1082" class="lbl">columns of this drawing.</text>
  <text x="620" y="1106" class="small">Swapped columns land on pins the module leaves</text>
  <text x="620" y="1122" class="small">unconnected: it does not start (inference, M5Stack schematic).</text>

  <text x="40" y="1196" class="small">Pins and DIP switches from M5Stack's Module CC1101 schematic (SCH V0.1, 2024-12-30) and the module's own print. Capture and send: components/gate-remote/README.md.</text>
</svg>
