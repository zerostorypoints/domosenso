# ble-proxy-living-room: a Bermuda BLE proxy in Living room. Written once by `domosenso add`
# from bermuda-presence 0.2.1, this home's file from now on; the packages are the catalog's at that tag.
substitutions:
  room: "living-room"
  area: "Living room"

esphome:
  area: ${area}

packages:
  proxy: github://zerostorypoints/domosenso/components/bermuda-presence/esphome/ble-proxy.yaml@bermuda-presence/0.2.1

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    encryption:  # uploads authenticated with the API key
