# audio-sensor-office: a room sound sensor in Office. Written once by `domosenso add`
# from audio-sensor 0.5.0, this home's file from now on; the package is the catalog's at that tag.
substitutions:
  room: "office"
  area: "Office"

esphome:
  area: ${area}

packages:
  sensor: github://zerostorypoints/domosenso/components/audio-sensor/esphome/audio-sensor-pdm.yaml@audio-sensor/0.5.0

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    encryption:  # uploads authenticated with the API key
