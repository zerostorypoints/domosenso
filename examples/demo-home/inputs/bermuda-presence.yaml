# The values the demo home supplies to the bermuda-presence component (its `inputs:` in
# component.yaml). ha/packages/bermuda_presence.yaml is what the component's instance template
# renders from these; the ESPHome device files under esphome/ are still written by hand.
rooms: [Living room, Dining, Kitchen, Office, Bedroom, Kids' room, Hall]
phones:
  sensor.alex_phone_area: Alex
  sensor.sam_phone_area: Sam
tablets:
  sensor.family_tablet_area: Sam
proxies:
  - {room: living-room, area: Living room, radar: false}
  - {room: dining, area: Dining, radar: true}
offline_notify: notify.mobile_app_alex_phone
minutes: 10
