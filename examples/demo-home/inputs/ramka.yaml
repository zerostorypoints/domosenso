# The values the demo home supplies to the ramka component (its `inputs:` in component.yaml).
# `uv run tools/domosenso_render.py components/ramka --inputs examples/demo-home/inputs/ramka.yaml
# --out <dir>` writes package.yaml and dashboard.{en,de,pl}.yaml from them. The tablet hangs in the
# Dining room, next to the BLE proxy with the radar. `room:` on the list items is the room slug
# scenes are joined on (component.yaml, inputs); the templates ignore it.
prefix: ramka
kiosk_user: Ramka

radar:
  presence: binary_sensor.dining_ble_proxy_dining_presence
  distance: sensor.dining_ble_proxy_dining_detection_distance

# Any media_player. This one is a plain network speaker: no streaming-service, quality or source
# sensors, so the template leaves out what reads them.
media_player: media_player.living_room_speaker
# The now-playing strip draws the music from audio-sensor's board in the living room (its
# `music: true`); the tablet switches between Spectrum, Level and the classic wave (0.4.0).
music_visual: spectrum
mains:
  power: sensor.media_plug_power
  voltage: sensor.media_plug_voltage

covers:
  - {entity: cover.awning_living_room, label: Living room, room: living_room}
  - {entity: cover.awning_kitchen, label: Kitchen, room: kitchen}
wind_sensor: binary_sensor.awnings_wind

lights:
  - {entity: light.living_room, label: Living room, room: living_room}
  - {entity: light.dining, label: Dining, room: dining}
  - {entity: light.kitchen, label: Kitchen, room: kitchen}
  - {entity: light.office, label: Office, room: office}
  - {entity: light.bedroom, label: Bedroom, room: bedroom}
  - {entity: light.kids_room, label: Kids' room, room: kids_room}
  - {entity: light.hall, label: Hall, room: hall}
lights_all_off: scene.all_lights_off

climate:
  - {label: Living room, temperature: sensor.living_room_temperature, humidity: sensor.living_room_humidity, room: living_room}
  - {label: Dining, temperature: sensor.dining_air_temperature, humidity: sensor.dining_air_humidity, room: dining}
  - {label: Kitchen, temperature: sensor.kitchen_temperature, humidity: sensor.kitchen_humidity, room: kitchen}
  - {label: Office, temperature: sensor.office_temperature, humidity: sensor.office_humidity, room: office}
  - {label: Bedroom, temperature: sensor.bedroom_temperature, humidity: sensor.bedroom_humidity, room: bedroom}
  - {label: Kids' room, temperature: sensor.kids_room_temperature, humidity: sensor.kids_room_humidity, room: kids_room}
  - {label: Hall, temperature: sensor.hall_temperature, humidity: sensor.hall_humidity, room: hall}
outside:
  temperature: sensor.outside_temperature
  humidity: sensor.outside_humidity

air:
  score: sensor.dining_air_quality_score
  co2: sensor.dining_air_carbon_dioxide
  pm2_5: sensor.dining_air_pm2_5
  voc: sensor.dining_air_voc_index
  nox: sensor.dining_air_nox_index
pressure: sensor.dining_air_pressure

plants:
  - {entity: plant.monstera, label: Living room, room: living_room}
  - {entity: plant.ficus, label: Office, room: office}
  - {entity: plant.basil, label: Kitchen, min_brightness: 1000, room: kitchen}

status:
  contacts:
    - {entity: binary_sensor.balcony_door_contact, label: Balcony door}
  power:
    - {entity: sensor.media_plug_power, label: Media power}
  locks:
    - {entity: lock.front_door, label: Front door}

weather: weather.forecast_home
calendar: calendar.family
photo_dir: /config/www/ramka

tablet_device:
  notify: notify.mobile_app_dining_tablet
  sensors: dining_tablet
alert_notify: notify.mobile_app_alex_phone
