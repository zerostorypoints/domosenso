name: Framework checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  framework:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: npm ci
      - run: tools/check-all.sh
