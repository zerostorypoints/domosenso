name: Preview cleanup
# pull_request_target runs this file and its default checkout from the base branch, which is what
# lets it see the Cloudflare secret. It is safe here because no pull-request code is checked out
# or run: the only PR-controlled input is the branch name, passed through an env variable.
on:
  pull_request_target:
    types: [closed]
permissions:
  contents: read
jobs:
  cleanup:
    # Fork pull requests have no previews of ours.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
      - name: Delete the branch's Cloudflare previews
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "skip: CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID not configured"
            exit 0
          fi
          uv run tools/cloudflare_previews.py --branch "$BRANCH"
