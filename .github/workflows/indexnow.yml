name: IndexNow
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  indexnow:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
      - name: Submit the changed pages once the site serves this commit
        env:
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          set -o pipefail
          base="$BEFORE"
          if [ "$base" = "0000000000000000000000000000000000000000" ]; then
            base="HEAD~1"
          fi
          uv run tools/website_changes.py --base "$base" --format urls | uv run tools/indexnow.py --sha "$SHA"
