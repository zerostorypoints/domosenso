# Room sound figures, from the Domosenso catalog (component audio-sensor). Edit the inputs and render
# again rather than editing this file.
#
# Each board gets a calibration offset (dB SPL = dBFS + offset): a helper to type it in and a sensor
# that shows it. A fresh helper starts at 0; the component's README says how to measure the offset.
# No helper has an `initial:`, so a restart keeps the calibrated values. Each board also has a flag
# (`<prefix>_spl_calibrated`, off = the offset is an estimate) and a note.

input_number:
  # The measurement the apply script writes into the selected board's offset helper.
  audio_sensor_measured_offset:
    name: Audio sensor measured offset
    min: 0
    max: 140
    step: 0.1
    mode: box
    unit_of_measurement: dB
    icon: mdi:ruler
  living_room_spl_offset:
    name: "Living room SPL offset"
    min: 0
    max: 140
    step: 0.1
    mode: box
    unit_of_measurement: dB
    icon: mdi:ear-hearing
  kids_room_spl_offset:
    name: "Kids' room SPL offset"
    min: 0
    max: 140
    step: 0.1
    mode: box
    unit_of_measurement: dB
    icon: mdi:ear-hearing

# Per board: whether the offset was measured (off = an estimate) and a note on how.
input_boolean:
  living_room_spl_calibrated:
    name: "Living room SPL calibrated"
    icon: mdi:check-decagram
  kids_room_spl_calibrated:
    name: "Kids' room SPL calibrated"
    icon: mdi:check-decagram
  # On while some view shows the music visual (the Ramka sets it): the spectrum rate `fast` applies
  # only then. One flag per home; no `initial:`, a restart keeps what the views last said.
  audio_sensor_music_watching:
    name: Audio sensor music watching
    icon: mdi:eye

input_text:
  living_room_spl_note:
    name: "Living room SPL note"
    max: 255
    icon: mdi:note-text
  kids_room_spl_note:
    name: "Kids' room SPL note"
    max: 255
    icon: mdi:note-text
  audio_sensor_calibration_note:
    name: Audio sensor calibration note
    max: 255
    icon: mdi:note-edit

# Which board feeds the music aliases, or `—` for none. The helper has no `initial:`: a restart keeps
# the choice, and a fresh one reads `unknown`, which the aliases treat as the `music: true` board (as
# none when no board is marked).
input_select:
  audio_sensor_music_source:
    name: Audio sensor music source
    icon: mdi:microphone-message
    options:
      - "Living room"
      - "Kids' room"
      - "—"
  # How often the music board publishes its spectrum: eco 500 ms, normal 200 ms, fast every 85 ms
  # (the newest frame). No `initial:`, which would undo the choice at every restart; normal comes
  # first because a fresh helper takes the first option (eco first started a new home on eco).
  audio_sensor_music_spectrum_rate:
    name: Audio sensor music spectrum rate
    icon: mdi:timer-cog-outline
    options:
      - normal
      - eco
      - fast

# The spectrum (31 values, five times a second) is only for the live wave, never for history.
recorder:
  exclude:
    entities:
      - sensor.living_room_audio_sensor_living_room_spectrum
      - sensor.kids_room_audio_sensor_kids_room_spectrum
      - sensor.music_spectrum

template:
  - sensor:
      - name: "Living room SPL offset"
        unique_id: audio_sensor_living_room_spl_offset
        default_entity_id: sensor.living_room_spl_offset
        unit_of_measurement: dB
        state_class: measurement
        state: "{{ states('input_number.living_room_spl_offset') | float(none) }}"
        attributes:
          component: audio-sensor
          area: "Living room"
          # room-meter-card drops its "estimated" note while this is true.
          calibrated: "{{ is_state('input_boolean.living_room_spl_calibrated', 'on') }}"
      - name: "Kids' room SPL offset"
        unique_id: audio_sensor_kids_room_spl_offset
        default_entity_id: sensor.kids_room_spl_offset
        unit_of_measurement: dB
        state_class: measurement
        state: "{{ states('input_number.kids_room_spl_offset') | float(none) }}"
        attributes:
          component: audio-sensor
          area: "Kids' room"
          # room-meter-card drops its "estimated" note while this is true.
          calibrated: "{{ is_state('input_boolean.kids_room_spl_calibrated', 'on') }}"
      # The music sensor, under names that do not depend on the room. Each alias looks up the board
      # whose area the select holds, in a map rendered here; the lookup is a dict get and one more
      # states() call, cheap enough for the spectrum, which changes five times a second. A select
      # that is unavailable, unknown or holds no board's area falls back to the `music: true` board,
      # the last argument of every lookup (to none when no board is marked). `—` (no sensor) and a
      # missing entity make an alias unavailable, in `availability`, not in the cheap state.
      - name: Music spectrum
        unique_id: audio_sensor_music_spectrum
        default_entity_id: sensor.music_spectrum
        icon: mdi:equalizer
        availability: >-
          {% set entity = {"Living room": "sensor.living_room_audio_sensor_living_room_spectrum", "Kids' room": "sensor.kids_room_audio_sensor_kids_room_spectrum", "—": ""}.get(states("input_select.audio_sensor_music_source"), "sensor.living_room_audio_sensor_living_room_spectrum") %}{{ entity != '' and has_value(entity) }}
        state: >-
          {{ states({"Living room": "sensor.living_room_audio_sensor_living_room_spectrum", "Kids' room": "sensor.kids_room_audio_sensor_kids_room_spectrum", "—": ""}.get(states("input_select.audio_sensor_music_source"), "sensor.living_room_audio_sensor_living_room_spectrum")) }}
        attributes:
          component: audio-sensor
      - name: Music SPL offset
        unique_id: audio_sensor_music_spl_offset
        default_entity_id: sensor.music_spl_offset
        availability: >-
          {% set entity = {"Living room": "input_number.living_room_spl_offset", "Kids' room": "input_number.kids_room_spl_offset", "—": ""}.get(states("input_select.audio_sensor_music_source"), "input_number.living_room_spl_offset") %}{{ entity != '' and has_value(entity) }}
        unit_of_measurement: dB
        state_class: measurement
        state: >-
          {{ states({"Living room": "input_number.living_room_spl_offset", "Kids' room": "input_number.kids_room_spl_offset", "—": ""}.get(states("input_select.audio_sensor_music_source"), "input_number.living_room_spl_offset")) | float(none) }}
        attributes:
          component: audio-sensor
          calibrated: >-
            {{ is_state({"Living room": "input_boolean.living_room_spl_calibrated", "Kids' room": "input_boolean.kids_room_spl_calibrated", "—": ""}.get(states("input_select.audio_sensor_music_source"), "input_boolean.living_room_spl_calibrated"), 'on') }}
      # dBFS plus the offset is dB SPL. No number from the source (or from the offset) gives none,
      # never the text unknown.
      - name: Music level
        unique_id: audio_sensor_music_level
        default_entity_id: sensor.music_level
        availability: >-
          {% set entity = {"Living room": "sensor.living_room_audio_sensor_living_room_sound_level", "Kids' room": "sensor.kids_room_audio_sensor_kids_room_sound_level", "—": ""}.get(states("input_select.audio_sensor_music_source"), "sensor.living_room_audio_sensor_living_room_sound_level") %}{{ entity != '' and has_value(entity) }}
        device_class: sound_pressure
        unit_of_measurement: dB
        state_class: measurement
        attributes:
          component: audio-sensor
        state: >-
          {% set level = states({"Living room": "sensor.living_room_audio_sensor_living_room_sound_level", "Kids' room": "sensor.kids_room_audio_sensor_kids_room_sound_level", "—": ""}.get(states("input_select.audio_sensor_music_source"), "sensor.living_room_audio_sensor_living_room_sound_level")) | float(none) %}
          {% set offset = states({"Living room": "input_number.living_room_spl_offset", "Kids' room": "input_number.kids_room_spl_offset", "—": ""}.get(states("input_select.audio_sensor_music_source"), "input_number.living_room_spl_offset")) | float(none) %}
          {{ (level + offset) | round(1) if level is not none and offset is not none else none }}
      - name: Music mic gain
        unique_id: audio_sensor_music_mic_gain
        default_entity_id: sensor.music_mic_gain
        icon: mdi:microphone-settings
        availability: >-
          {% set entity = {"Living room": "sensor.living_room_audio_sensor_living_room_mic_gain", "Kids' room": "sensor.kids_room_audio_sensor_kids_room_mic_gain", "—": ""}.get(states("input_select.audio_sensor_music_source"), "sensor.living_room_audio_sensor_living_room_mic_gain") %}{{ entity != '' and has_value(entity) }}
        state: >-
          {{ states({"Living room": "sensor.living_room_audio_sensor_living_room_mic_gain", "Kids' room": "sensor.kids_room_audio_sensor_kids_room_mic_gain", "—": ""}.get(states("input_select.audio_sensor_music_source"), "sensor.living_room_audio_sensor_living_room_mic_gain")) }}
        attributes:
          component: audio-sensor
      # `calibrated` once the apply script (or the home) turned the board's flag on, else `estimate`.
      - name: Music SPL calibration
        unique_id: audio_sensor_music_spl_calibration
        default_entity_id: sensor.music_spl_calibration
        icon: mdi:tune
        availability: >-
          {% set entity = {"Living room": "input_boolean.living_room_spl_calibrated", "Kids' room": "input_boolean.kids_room_spl_calibrated", "—": ""}.get(states("input_select.audio_sensor_music_source"), "input_boolean.living_room_spl_calibrated") %}{{ entity != '' and has_value(entity) }}
        state: >-
          {{ 'calibrated' if is_state({"Living room": "input_boolean.living_room_spl_calibrated", "Kids' room": "input_boolean.kids_room_spl_calibrated", "—": ""}.get(states("input_select.audio_sensor_music_source"), "input_boolean.living_room_spl_calibrated"), 'on') else 'estimate' }}
        attributes:
          component: audio-sensor
          note: >-
            {{ states({"Living room": "input_text.living_room_spl_note", "Kids' room": "input_text.kids_room_spl_note", "—": ""}.get(states("input_select.audio_sensor_music_source"), "input_text.living_room_spl_note")) }}

  - binary_sensor:
      - name: Music sensor online
        unique_id: audio_sensor_music_sensor_online
        default_entity_id: binary_sensor.music_sensor_online
        device_class: connectivity
        state: >-
          {{ states({"Living room": "sensor.living_room_audio_sensor_living_room_spectrum", "Kids' room": "sensor.kids_room_audio_sensor_kids_room_spectrum", "—": ""}.get(states("input_select.audio_sensor_music_source"), "sensor.living_room_audio_sensor_living_room_spectrum")) not in ['unavailable', 'unknown'] }}
        attributes:
          component: audio-sensor

  # The music source contract (SPEC-025): the board the select holds, and what it can do. An ability
  # is the board's capability, not whether data flows now, so these update on start, on a change of
  # the select and once a minute, never on the spectrum.
  - triggers:
      - trigger: homeassistant
        event: start
      - trigger: state
        entity_id: input_select.audio_sensor_music_source
      - trigger: time_pattern
        minutes: "/1"
    sensor:
      - name: Music source
        unique_id: audio_sensor_music_source
        default_entity_id: sensor.music_source
        icon: mdi:microphone-message
        state: >-
          {{ {"Living room": "Living room", "Kids' room": "Kids' room", "—": ""}.get(states("input_select.audio_sensor_music_source"), "Living room") or 'none' }}
        attributes:
          component: audio-sensor
          interface: 1
          capabilities: >-
            {% set e = {"Living room": "sensor.living_room_audio_sensor_living_room_spectrum", "Kids' room": "sensor.kids_room_audio_sensor_kids_room_spectrum", "—": ""}.get(states("input_select.audio_sensor_music_source"), "sensor.living_room_audio_sensor_living_room_spectrum") %}{% set here = e != '' and expand(e) | count == 1 %}{% set spectrum = here and (states(e) in ['unavailable', 'unknown'] or states(e).split(',') | count == 31) %}{% set e = {"Living room": "sensor.living_room_audio_sensor_living_room_sound_level", "Kids' room": "sensor.kids_room_audio_sensor_kids_room_sound_level", "—": ""}.get(states("input_select.audio_sensor_music_source"), "sensor.living_room_audio_sensor_living_room_sound_level") %}{% set here = e != '' and expand(e) | count == 1 %}{% set level = here and (states(e) in ['unavailable', 'unknown'] or states(e) | is_number) %}{% set e = {"Living room": "select.living_room_audio_sensor_living_room_spectrum_rate", "Kids' room": "select.kids_room_audio_sensor_kids_room_spectrum_rate", "—": ""}.get(states("input_select.audio_sensor_music_source"), "select.living_room_audio_sensor_living_room_spectrum_rate") %}{% set here = e != '' and expand(e) | count == 1 %}{% set options = state_attr(e, 'options') %}{% set rate = here and ((options is none and states(e) in ['unavailable', 'unknown']) or (options is not none and ['eco', 'normal', 'fast'] | reject('in', options) | list | count == 0)) %}{% set e = {"Living room": "sensor.living_room_audio_sensor_living_room_sound_level", "Kids' room": "sensor.kids_room_audio_sensor_kids_room_sound_level", "—": ""}.get(states("input_select.audio_sensor_music_source"), "sensor.living_room_audio_sensor_living_room_sound_level") %}{% set here = e != '' and expand(e) | count == 1 %}{% set calibration = here and (states(e) in ['unavailable', 'unknown'] or states(e) | is_number) %}{% set e = {"Living room": "sensor.living_room_audio_sensor_living_room_mic_gain", "Kids' room": "sensor.kids_room_audio_sensor_kids_room_mic_gain", "—": ""}.get(states("input_select.audio_sensor_music_source"), "sensor.living_room_audio_sensor_living_room_mic_gain") %}{% set here = e != '' and expand(e) | count == 1 %}{% set gain = here %}{{ (['spectrum'] if spectrum else []) + (['level'] if level else []) + (['rate'] if rate else []) + (['calibration'] if calibration else []) + (['gain'] if gain else []) }}
    binary_sensor:
      - name: Music source spectrum
        unique_id: audio_sensor_music_source_spectrum
        default_entity_id: binary_sensor.music_source_spectrum
        state: >-
          {% set e = {"Living room": "sensor.living_room_audio_sensor_living_room_spectrum", "Kids' room": "sensor.kids_room_audio_sensor_kids_room_spectrum", "—": ""}.get(states("input_select.audio_sensor_music_source"), "sensor.living_room_audio_sensor_living_room_spectrum") %}{% set here = e != '' and expand(e) | count == 1 %}{% set spectrum = here and (states(e) in ['unavailable', 'unknown'] or states(e).split(',') | count == 31) %}{{ spectrum }}
        attributes:
          component: audio-sensor
      - name: Music source level
        unique_id: audio_sensor_music_source_level
        default_entity_id: binary_sensor.music_source_level
        state: >-
          {% set e = {"Living room": "sensor.living_room_audio_sensor_living_room_sound_level", "Kids' room": "sensor.kids_room_audio_sensor_kids_room_sound_level", "—": ""}.get(states("input_select.audio_sensor_music_source"), "sensor.living_room_audio_sensor_living_room_sound_level") %}{% set here = e != '' and expand(e) | count == 1 %}{% set level = here and (states(e) in ['unavailable', 'unknown'] or states(e) | is_number) %}{{ level }}
        attributes:
          component: audio-sensor
      - name: Music source rate
        unique_id: audio_sensor_music_source_rate
        default_entity_id: binary_sensor.music_source_rate
        state: >-
          {% set e = {"Living room": "select.living_room_audio_sensor_living_room_spectrum_rate", "Kids' room": "select.kids_room_audio_sensor_kids_room_spectrum_rate", "—": ""}.get(states("input_select.audio_sensor_music_source"), "select.living_room_audio_sensor_living_room_spectrum_rate") %}{% set here = e != '' and expand(e) | count == 1 %}{% set options = state_attr(e, 'options') %}{% set rate = here and ((options is none and states(e) in ['unavailable', 'unknown']) or (options is not none and ['eco', 'normal', 'fast'] | reject('in', options) | list | count == 0)) %}{{ rate }}
        attributes:
          component: audio-sensor
      - name: Music source calibration
        unique_id: audio_sensor_music_source_calibration
        default_entity_id: binary_sensor.music_source_calibration
        state: >-
          {% set e = {"Living room": "sensor.living_room_audio_sensor_living_room_sound_level", "Kids' room": "sensor.kids_room_audio_sensor_kids_room_sound_level", "—": ""}.get(states("input_select.audio_sensor_music_source"), "sensor.living_room_audio_sensor_living_room_sound_level") %}{% set here = e != '' and expand(e) | count == 1 %}{% set calibration = here and (states(e) in ['unavailable', 'unknown'] or states(e) | is_number) %}{{ calibration }}
        attributes:
          component: audio-sensor

# Applies the measurement to the board the select holds: the offset, the note, and the flag that says
# the offset is no longer an estimate. The same map as the aliases, so both agree on the board.
script:
  audio_sensor_apply_calibration:
    alias: Audio sensor apply calibration
    icon: mdi:check-decagram
    mode: single
    sequence:
      # Stop, writing nothing, unless the measurement is a number and the note has a state: an
      # unavailable helper must not set the offset to 0 or the note to "unavailable", nor turn the
      # calibrated flag on.
      - condition: template
        value_template: >-
          {{ states('input_number.audio_sensor_measured_offset') | is_number
             and states('input_text.audio_sensor_calibration_note') not in ['unavailable', 'unknown'] }}
      - variables:
          board: >-
            {{ {"Living room": "living_room", "Kids' room": "kids_room", "—": ""}.get(states("input_select.audio_sensor_music_source"), "living_room") }}
      # No board selected (`—`, or no music board): nothing to apply the measurement to.
      - condition: template
        value_template: "{{ board != '' }}"
      - action: input_number.set_value
        target:
          entity_id: "{{ 'input_number.' ~ board ~ '_spl_offset' }}"
        data:
          value: "{{ states('input_number.audio_sensor_measured_offset') | float }}"
      - action: input_text.set_value
        target:
          entity_id: "{{ 'input_text.' ~ board ~ '_spl_note' }}"
        data:
          value: "{{ states('input_text.audio_sensor_calibration_note') }}"
      - action: input_boolean.turn_on
        target:
          entity_id: "{{ 'input_boolean.' ~ board ~ '_spl_calibrated' }}"

# Forwards the spectrum rate to the board the music source select holds, the same map as the aliases.
# `fast` costs Wi-Fi airtime and the board's CPU, so it applies only while someone watches; 10 s after
# the last view leaves, the board goes back to normal (a quick page flip keeps it fast). Any change of
# a board's select re-applies the profile: its coming back online (an offline board cannot take the
# option), its own 60 min timeout from fast to normal while someone still watches, a change made on
# the board (HA owns the profile). Setting the option it already has changes no state, so no loop.
# HA's start re-applies too. A source change sets the board it leaves to normal.
automation:
  - id: audio_sensor_music_spectrum_rate
    alias: Audio sensor music spectrum rate
    description: Set the music board's Spectrum rate to the chosen profile, fast only while watching.
    mode: queued
    triggers:
      - trigger: state
        entity_id: input_select.audio_sensor_music_spectrum_rate
        id: choice
      - trigger: state
        entity_id: input_boolean.audio_sensor_music_watching
        to: "on"
        id: watching
      - trigger: state
        entity_id: input_boolean.audio_sensor_music_watching
        to: "off"
        for:
          seconds: 10
        id: watching
      - trigger: state
        entity_id: input_select.audio_sensor_music_source
        id: source
      - trigger: homeassistant
        event: start
        id: start
      - trigger: state
        entity_id:
          - select.living_room_audio_sensor_living_room_spectrum_rate
          - select.kids_room_audio_sensor_kids_room_spectrum_rate
        not_to:
          - unavailable
          - unknown
        id: board
    actions:
      - variables:
          target: >-
            {{ {"Living room": "select.living_room_audio_sensor_living_room_spectrum_rate", "Kids' room": "select.kids_room_audio_sensor_kids_room_spectrum_rate", "—": ""}.get(states("input_select.audio_sensor_music_source"), "select.living_room_audio_sensor_living_room_spectrum_rate") }}
          previous: >-
            {{ {"Living room": "select.living_room_audio_sensor_living_room_spectrum_rate", "Kids' room": "select.kids_room_audio_sensor_kids_room_spectrum_rate", "—": ""}.get(trigger.from_state.state, "select.living_room_audio_sensor_living_room_spectrum_rate")
               if trigger.id == 'source' and trigger.from_state is not none else '' }}
          option: >-
            {% set choice = states('input_select.audio_sensor_music_spectrum_rate') %}
            {% if choice == 'fast' %}{{ 'fast' if is_state('input_boolean.audio_sensor_music_watching', 'on') else 'normal' }}
            {%- elif choice == 'eco' %}eco{% else %}normal{% endif %}
      - if:
          - condition: template
            value_template: >-
              {{ previous != '' and previous != target and states(previous) not in ['unavailable', 'unknown'] }}
        then:
          - action: select.select_option
            target:
              entity_id: "{{ previous }}"
            data:
              option: normal
      - condition: template
        value_template: >-
          {{ target != '' and states(target) not in ['unavailable', 'unknown'] }}
      - action: select.select_option
        target:
          entity_id: "{{ target }}"
        data:
          option: "{{ option }}"
