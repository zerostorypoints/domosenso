# The demo home's Ramka inputs with plants: discover (SPEC-022): the card finds the plants the
# plants component marks. Used by tests/test_ramka_render.py and tools/check-all.sh (ha-check).
prefix: ramka
kiosk_user: Ramka
radar:
  presence: binary_sensor.dining_ble_proxy_dining_presence
  distance: sensor.dining_ble_proxy_dining_detection_distance
media_player: media_player.living_room_speaker
music_visual: spectrum
mains:
  power: sensor.media_plug_power
  voltage: sensor.media_plug_voltage
covers:
- entity: cover.awning_living_room
  label: Living room
  room: living_room
- entity: cover.awning_kitchen
  label: Kitchen
  room: kitchen
wind_sensor: binary_sensor.awnings_wind
lights:
- entity: light.living_room
  label: Living room
  room: living_room
- entity: light.dining
  label: Dining
  room: dining
- entity: light.kitchen
  label: Kitchen
  room: kitchen
- entity: light.office
  label: Office
  room: office
- entity: light.bedroom
  label: Bedroom
  room: bedroom
- entity: light.kids_room
  label: Kids' room
  room: kids_room
- entity: light.hall
  label: Hall
  room: hall
lights_all_off: scene.all_lights_off
climate:
- label: Living room
  temperature: sensor.living_room_temperature
  humidity: sensor.living_room_humidity
  room: living_room
- label: Dining
  temperature: sensor.dining_air_temperature
  humidity: sensor.dining_air_humidity
  room: dining
- label: Kitchen
  temperature: sensor.kitchen_temperature
  humidity: sensor.kitchen_humidity
  room: kitchen
- label: Office
  temperature: sensor.office_temperature
  humidity: sensor.office_humidity
  room: office
- label: Bedroom
  temperature: sensor.bedroom_temperature
  humidity: sensor.bedroom_humidity
  room: bedroom
- label: Kids' room
  temperature: sensor.kids_room_temperature
  humidity: sensor.kids_room_humidity
  room: kids_room
- label: Hall
  temperature: sensor.hall_temperature
  humidity: sensor.hall_humidity
  room: hall
outside:
  temperature: sensor.outside_temperature
  humidity: sensor.outside_humidity
air:
  score: sensor.dining_air_quality_score
  co2: sensor.dining_air_carbon_dioxide
  pm2_5: sensor.dining_air_pm2_5
  voc: sensor.dining_air_voc_index
  nox: sensor.dining_air_nox_index
pressure: sensor.dining_air_pressure
plants: discover
status:
  contacts:
  - entity: binary_sensor.balcony_door_contact
    label: Balcony door
  power:
  - entity: sensor.media_plug_power
    label: Media power
  locks:
  - entity: lock.front_door
    label: Front door
weather: weather.forecast_home
calendar: calendar.family
photo_dir: /config/www/ramka
tablet_device:
  notify: notify.mobile_app_dining_tablet
  sensors: dining_tablet
alert_notify: notify.mobile_app_alex_phone
