# The demo home's Ramka inputs without its own room lists (P3): lights, climate, outside, air,
# weather, covers and status come from examples/demo-home/home.inputs.yaml (templates/_home.jinja).
# For `INPUTS=tests/fixtures/ramka-from-home.yaml tools/ha-check.sh ramka` (tools/check-all.sh).
prefix: ramka
kiosk_user: Ramka
radar:
  presence: binary_sensor.dining_ble_proxy_dining_presence
  distance: sensor.dining_ble_proxy_dining_detection_distance
media_player: media_player.living_room_speaker
music_visual: spectrum
mains:
  power: sensor.media_plug_power
  voltage: sensor.media_plug_voltage
wind_sensor: binary_sensor.awnings_wind
lights_all_off: scene.all_lights_off
actions:
- entity: button.gate_remote_garage
  label: Garage
  icon: mdi:garage-variant
  room: hall
- entity: scene.movie_night
  label: Movie night
  confirm: false
  room: living_room
pressure: sensor.dining_air_pressure
plants:
- entity: plant.monstera
  label: Living room
  room: living_room
- entity: plant.ficus
  label: Office
  room: office
- entity: plant.basil
  label: Kitchen
  min_brightness: 1000
  room: kitchen
calendar: calendar.family
photo_dir: /config/www/ramka
tablet_device:
  notify: notify.mobile_app_dining_tablet
  sensors: dining_tablet
alert_notify: notify.mobile_app_alex_phone
