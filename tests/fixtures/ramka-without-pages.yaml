# The demo home's ramka inputs without climate, air and plants (and outside and pressure, which only
# the climate page reads): tools/check-all.sh runs check_config on this render too (ramka 0.2.0).
prefix: ramka
kiosk_user: Ramka
radar:
  presence: binary_sensor.dining_ble_proxy_dining_presence
  distance: sensor.dining_ble_proxy_dining_detection_distance
media_player: media_player.living_room_speaker
mains:
  power: sensor.media_plug_power
  voltage: sensor.media_plug_voltage
covers:
- entity: cover.awning_living_room
  label: Living room
  room: living_room
- entity: cover.awning_kitchen
  label: Kitchen
  room: kitchen
wind_sensor: binary_sensor.awnings_wind
lights:
- entity: light.living_room
  label: Living room
  room: living_room
- entity: light.dining
  label: Dining
  room: dining
- entity: light.kitchen
  label: Kitchen
  room: kitchen
- entity: light.office
  label: Office
  room: office
- entity: light.bedroom
  label: Bedroom
  room: bedroom
- entity: light.kids_room
  label: Kids' room
  room: kids_room
- entity: light.hall
  label: Hall
  room: hall
lights_all_off: scene.all_lights_off
status:
  contacts:
  - entity: binary_sensor.balcony_door_contact
    label: Balcony door
  power:
  - entity: sensor.media_plug_power
    label: Media power
  locks:
  - entity: lock.front_door
    label: Front door
weather: weather.forecast_home
calendar: calendar.family
photo_dir: /config/www/ramka
tablet_device:
  notify: notify.mobile_app_dining_tablet
  sensors: dining_tablet
alert_notify: notify.mobile_app_alex_phone
